name: Nikkei VI Teams notifier

on:
  schedule:
    # The official VI daily CSV updates ~16:10-18:25 JST (the close itself is
    # fixed ~15:50), so 19:00 JST is the first reliable slot.
    #
    # The PC's Task Scheduler dispatches this workflow at 18:55 JST and is what
    # actually delivers on time; GitHub's cron is only a safety net for days the
    # PC is off or its token has expired. Cron is best-effort and in practice
    # runs *hours* late or drops slots entirely (observed repeatedly, and on
    # 2026-10-05 a slot was cancelled outright with "job was not acquired by
    # Runner of type hosted"), so extra slots buy nothing but noise.
    #
    # Both slots sit AFTER the 09:55 UTC dispatch on purpose: a punctual cron
    # ahead of it would pre-empt the PC trigger and take back control of the
    # delivery time. Odd minutes because :00 and :30 are delayed the most.
    #
    # Running late is safe for the macro panel: completeness of the US session
    # is decided in code (drop_incomplete_session), not by the schedule, and the
    # script de-dups by rate date so a late slot simply exits.
    #   11:11 UTC = 20:11 JST  (safety net if the PC missed 18:55)
    #   14:07 UTC = 23:07 JST  (last chance before JST midnight)
    - cron: "11 11 * * 1-5"
    - cron: "7 14 * * 1-5"
  workflow_dispatch:
    inputs:
      always_post:
        description: "Post the latest VI even if it was already posted"
        type: boolean
        default: false

concurrency:
  group: vi-notify
  cancel-in-progress: false

permissions:
  contents: write            # to commit the chart PNG and the de-dup state

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data, build chart and card
        id: prep
        env:
          ALWAYS_POST: ${{ inputs.always_post && '1' || '' }}
          STATE_FILE: state/last_posted.txt
          CHART_PATH: charts/latest.png
          # Teams can only render an image from a public URL, hence this repo
          # being public and the chart being committed on every update.
          CHART_URL_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/charts/latest.png
        run: |
          python vi_bot.py --prepare
          if [ -f out/card.json ]; then
            echo "prepared=true" >> "$GITHUB_OUTPUT"
          else
            echo "prepared=false" >> "$GITHUB_OUTPUT"
            echo "nothing new to post"
          fi

      # The chart must be live at its URL *before* Teams renders the card,
      # otherwise the image comes through broken.
      - name: Publish chart
        if: ${{ steps.prep.outputs.prepared == 'true' }}
        run: |
          git config user.name "vi-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain charts/latest.png)" ]; then
            git add charts/latest.png
            git commit -m "chart: update Nikkei VI chart [skip ci]"
            git push
            echo "chart published"
          else
            echo "chart unchanged"
          fi

      - name: Post to Teams
        if: ${{ steps.prep.outputs.prepared == 'true' }}
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          STATE_FILE: state/last_posted.txt
        run: python vi_bot.py --post

      - name: Persist de-dup state
        if: ${{ steps.prep.outputs.prepared == 'true' }}
        run: |
          if [ -n "$(git status --porcelain state/last_posted.txt)" ]; then
            git add state/last_posted.txt
            git commit -m "chore: record last posted VI date [skip ci]"
            git push
            echo "state updated"
          else
            echo "no state change"
          fi
